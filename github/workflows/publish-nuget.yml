
name: Publish Poshteh NuGet

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build NuGet Packages
        run: |
          dotnet pack \
            --configuration Release \
            --output ./nupkg

      - name: Get temporary NuGet API Key
        id: login
        uses: NuGet/login@v1
        with:
          user: dadollahi

      - name: Publish to NuGet
        run: |
          dotnet nuget push "./nupkg/Poshteh.*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
