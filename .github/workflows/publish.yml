name: Publish to NuGet

on:
  push:
    tags: [ 'v*' ]          # مثلا v10.0.2

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget       # باید با Environment در Policy یکی باشد
    permissions:
      id-token: write        # بدون این، گیت‌هاب توکن OIDC صادر نمی‌کند
      contents: read
    defaults:
      run:
        working-directory: Framwrok

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Framwrok/global.json

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Poshteh.slnx -c Release -p:PoshtehVersion=$VERSION

      - name: Build & pack
        run: dotnet build Poshteh.slnx -c Release -p:PoshtehVersion=$VERSION -p:PoshtehPackageOutputPath=${{ github.workspace }}/artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
